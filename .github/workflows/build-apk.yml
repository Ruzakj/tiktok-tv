name: Build Android TV APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> $GITHUB_PATH
      - name: Build signed APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Prepare install APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TikTok-TV-Lite-signed.apk
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-tv-lite-signed-installable
          path: TikTok-TV-Lite-signed.apk
          if-no-files-found: error
